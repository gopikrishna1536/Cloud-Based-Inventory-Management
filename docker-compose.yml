version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: stockcloud_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: stockcloud_db
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockcloud_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/stockcloud_db
      JWT_SECRET: dev_stockcloud_jwt_secret_2026
    depends_on:
      - mongodb

volumes:
  mongo_data:
